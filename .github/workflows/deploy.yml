name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you deploy from a branch before merging, from the Actions tab.
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN does not have them.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The logic that decides what weight to put on the bar is worth gating on.
      - run: npm test

      # Served from https://<user>.github.io/gains/, so the app is built for
      # that subpath rather than the domain root.
      - run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
